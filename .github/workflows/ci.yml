name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check public safety
        run: python3 tools/check_public_safety.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - name: Representative browser test
        env:
          PHOTO_ROUTE_TEST_BROWSER: chromium
          PHOTO_ROUTE_TEST_PORT: '18198'
        run: npx playwright test tests/e2e/developer-onboarding.spec.ts tests/e2e/automatic-large-jpeg.spec.ts --reporter=line
